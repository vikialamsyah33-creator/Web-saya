
<!DOCTYPE html>
<html>
  <meta name="monetag" content="009cd86bba43ffe744ad591c29fff3db">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f4f4f9;
    }
    h1 {
      color: #333;
    }
    .cta-container {
      margin-top: 30px;
    }
    .btn-cta {
      display: inline-block;
      padding: 16px 36px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #ff0055, #ff5000);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
    }
    .btn-cta:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
    }
  </style>
</head>
<body>

  <h1>Selamat Datang di Web Saya</h1>
  <p>Klik tombol di bawah ini:</p>

  <div class="cta-container">
    <a href="#" class="btn-cta">
      🔥 ENTER NOW FREE 🔥
    </a>
  </div>

</body>
